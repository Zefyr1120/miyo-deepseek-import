<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">miyo-deepseek-import — turn a DeepSeek export zip into the chat archive Miyo already reads</title>
  <desc id="heroDesc">Left: project name, one-line value, and a scale line of 1,000+ conversations, about a hundred attachments, 22 MB. Right: a DeepSeek chat_sessions JSON filename converting into a Miyo chat Markdown filename ending in a short id.</desc>
  <defs>
    <marker id="heroArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4D6BFE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="340" fill="#0B0D13"/>
  <line x1="640" y1="48" x2="640" y2="300" stroke="#1C202A" stroke-width="1"/>
  <text x="64" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#6E7686" letter-spacing="2.4">PYTHON 3.9+  ·  NO DEPENDENCIES</text>
  <text x="64" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="50" font-weight="600" fill="#F4F6FA">miyo-deepseek-import</text>
  <text x="64" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" fill="#AEB6C6">Point it at a DeepSeek export zip.</text>
  <text x="64" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" fill="#AEB6C6">Get the chat archive Miyo already reads.</text>
  <text x="64" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5F6777">1,000+ conversations  ·  ~22 MB of Markdown</text>
  <text x="688" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6E7686" letter-spacing="2">DEEPSEEK EXPORT</text>
  <rect x="688" y="88" width="448" height="62" rx="12" fill="#14171F" stroke="#262B36" stroke-width="1"/>
  <text x="712" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#C8CEDA">chat_sessions/*.json</text>
  <line x1="912" y1="156" x2="912" y2="190" stroke="#4D6BFE" stroke-width="2" marker-end="url(#heroArrow)"/>
  <text x="688" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6E7686" letter-spacing="2">MIYO CHAT ARCHIVE</text>
  <rect x="688" y="224" width="448" height="78" rx="12" fill="#121A2E" stroke="#2E4B8F" stroke-width="1"/>
  <text x="712" y="259" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#E8ECF6">2026-03-14 Attention math</text>
  <text x="712" y="287" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#6C8BFF">(4c1e9a07).md</text>
</svg>
